      security: [{ bearerAuth: [] }]
      parameters:
        - { name: course_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Done }
        "404": { description: Not found (or not yours) }

  /teacher/courses/{course_id}/lessons:
    post:
      tags: [M5 teacher]
