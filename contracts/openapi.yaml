  /teacher/courses/{course_id}/unpublish:
    post:
      tags: [M5 teacher]
      operationId: unpublishCourse
      summary: "Hide the course from students."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: course_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { description: Not found (or not yours) }

  /rooms/{room_id}/courses:
    get:
      tags: [M1 platform]
      operationId: listRoomCourses
      summary: "The courses published to this room, for its students and its teacher."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCourses" }
        "401": { description: Not signed in }
        "403": { description: Not in this room }

  /rooms/{room_id}/courses/{course_id}/assets/{asset_id}/file:
    get:
      tags: [M1 platform]
      operationId: getRoomCourseFile
      summary: "A file of a published course. Only items in the published snapshot are served."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: path, required: true, schema: { type: string } }
        - { name: course_id, in: path, required: true, schema: { type: string } }
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Done }
        "403": { description: Not in this room }
        "404": { description: Not in the published course }

  /teacher/stories:
    post:
      tags: [M5 teacher]
      operationId: createStory
      summary: "Plan a multi-scene video (an LLM writes the scenes) and start it. Every scene is a paid video job that starts from the last frame of the one before; the scenes are joined with ffmpeg (optional narration). The same request returns the same story; a failed one restarts only with retry=true."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoryCreate" }
      responses:
        "201":
          description: Sample file in samples/story.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryStatus" }
        "401": { description: Not signed in as a teacher }
        "422": { description: Invalid input or the planner returned no usable story }
        "503": { description: DASHSCOPE_API_KEY is not set, or ffmpeg is not installed }

  /teacher/stories/{asset_id}:
    get:
      tags: [M5 teacher]
      operationId: getStory
      summary: "Progress of a story. Each call also moves it one step forward, so the page only has to poll (every few seconds)."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file in samples/story.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryStatus" }
        "401": { description: Not signed in as a teacher }
        "404": { description: Not found (or not yours) }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TeacherId:
      name: teacher_id
      in: query
      required: true
      description: Until M1's login exists. Afterwards the teacher comes from the token.
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    RoomId:
      name: room_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    # ---- shared small pieces ------------------------------------------------
    Language:
      type: string
      enum: [ar, en]
    Role:
      type: string
      enum: [student, teacher]

    # ---- M1 ------------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Login:
      type: object
      additionalProperties: false
      required: [token, user_id, name, role]
      properties:
        token: { type: string }
        user_id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Room:
      type: object
      additionalProperties: false
      required: [room_id, name, kind, files_ready]
      properties:
        room_id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [course, personal]
          description: "personal exists only if proposal 1 is accepted"
        files_ready:
          type: integer
          minimum: 0
          description: how many files in the room are indexed and ready

    MyRooms:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        join_code: { type: string, description: "optional, students only" }

    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }

    CreateRoomResult:
      type: object
      additionalProperties: false
      required: [room, join_code]
      properties:
        room: { $ref: "#/components/schemas/Room" }
        join_code: { type: string }

    JoinCode:
      type: object
      additionalProperties: false
      required: [join_code]
      properties:
        join_code: { type: string, description: "e.g. K7Q-4MX" }

    RoomFile:
      type: object
      additionalProperties: false
      required: [file_id, name, source, status]
      properties:
        file_id: { type: string }
        name: { type: string }
        source: { type: string, enum: [teacher, assistant] }
        status: { type: string, enum: [uploaded, indexing, ready, failed] }

    RoomFiles:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/RoomFile" }

    RoomStudent:
      type: object
      additionalProperties: false
      required: [user_id, name, questions_this_week, mastery, status]
      properties:
        user_id: { type: string }
        name: { type: string }
        questions_this_week: { type: integer, minimum: 0 }
        mastery:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: from M4. null until M4 has data for this student
        status:
          type: [string, "null"]
          enum: [on_track, watch, struggling, null]
          description: from M4. null until M4 has data for this student

    RoomStudents:
      type: object
      additionalProperties: false
      required: [students]
      properties:
        students:
          type: array
          items: { $ref: "#/components/schemas/RoomStudent" }
    UploadFile:
      type: object
      additionalProperties: false
      required: [file_id, status]
      properties:
        file_id: { type: string }
        status:
          type: string
          enum: [uploaded, indexing, ready, failed]

    SnapResult:
      type: object
      additionalProperties: false
      required: [file_id, type, language, text, confidence]
      properties:
        file_id: { type: string }
        type:
          type: string
          enum: [student_work, material, diagram, other]
        language: { $ref: "#/components/schemas/Language" }
        text: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1

    CopilotRequest:
      type: object
      additionalProperties: false
      required: [room_id, text]
      properties:
        room_id: { type: string }
        text: { type: string }
        file_id:
          type: string
          description: set when the student attached a photo (the Snap result id)
        mode:
          type: string
          enum: [auto, ask, check_work]
          default: auto
          description: >
            auto = the Copilot decides. ask / check_work = the student chose explicitly
            ("explain this photo" vs "check my solution"), so the Copilot skips classification.

    CopilotReply:
      type: object
      additionalProperties: false
      required: [route, reply, payload]
      properties:
        route:
          type: string
          enum: [ask, quiz, check_work, plan, clarify]
        reply:
          type: string
          description: short text shown in the chat
        payload:
          type: object
          description: >
            Depends on route. ask = a TutorAnswer, quiz = {quiz_id, topic_id},
            check_work = a HandwritingCheck, plan = {topic_id}, clarify = {}.
            Extra flags the UI reads: sample (true when the result is a contract sample because
            the owning service is not connected yet), unavailable, needs_photo,
            escalated + question_id, verified_by_teacher.
          additionalProperties: true

    # ---- M2 ------------------------------------------------------------------
    SearchRequest:
      type: object
      additionalProperties: false
      required: [room_id, query]
      properties:
        room_id: { type: string }
        query: { type: string }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }

    Chunk:
      type: object
      additionalProperties: false
      required: [file_name, page, text, topic_id]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        topic_id: { type: string }

    SearchMaterial:
      type: object
      additionalProperties: false
      required: [chunks]
      properties:
        chunks:
          type: array
          items: { $ref: "#/components/schemas/Chunk" }

    Topic:
      type: object
      additionalProperties: false
      required: [topic_id, name]
      properties:
        topic_id: { type: string }
        name: { type: string }

    RoomTopics:
      type: object
      additionalProperties: false
      required: [topics]
      properties:
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }

    SourcePage:
      type: object
      additionalProperties: false
      required: [file_name, page]
      anyOf:
        - required: [text]
        - required: [image_url]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        image_url: { type: string }

    # ---- M3 ------------------------------------------------------------------
    TutorRequest:
      type: object
      additionalProperties: false
      required: [room_id, question]
      properties:
        room_id: { type: string }
        question: { type: string }
        language: { $ref: "#/components/schemas/Language" }

    Citation:
      type: object
      additionalProperties: false
      required: [file_name, page]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }

    TutorAnswer:
      type: object
      additionalProperties: false
      required: [answer, citations, grounded, steps]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        grounded:
          type: boolean
          description: false when the material did not contain the answer
        steps:
          type: array
          items: { type: string }
          description: PROPOSAL 4. Empty list means one full answer, no step-by-step mode.

    CheckWorkRequest:
      type: object
      additionalProperties: false
      required: [room_id, file_id, text]
      properties:
        room_id: { type: string }
        file_id: { type: string }
        text:
          type: string
          description: the text read from the photo (SnapResult.text)

    Box:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: A rectangle on the photo. All four numbers are fractions of the image size, from 0 to 1.
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }

    WorkStep:
      type: object
      additionalProperties: false
      required: [text, correct]
      properties:
        text: { type: string }
        correct: { type: boolean }

    HandwritingCheck:
      type: object
      additionalProperties: false
      required: [boxes, steps, hint]
      properties:
        boxes:
          type: array
          description: marks the first wrong step. Empty if all steps are correct.
          items: { $ref: "#/components/schemas/Box" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkStep" }
        hint:
          type: string
          description: a nudge, never the full solution

    # ---- M4 ------------------------------------------------------------------
    MakeQuizRequest:
      type: object
      additionalProperties: false
      required: [room_id, topic_id]
      properties:
        room_id: { type: string }
        topic_id: { type: string }
        count: { type: integer, minimum: 1, maximum: 20, default: 5 }

    QuizQuestion:
      type: object
      additionalProperties: false
      required: [text, choices, correct_answer, explanation]
      properties:
        text: { type: string }
        choices:
          type: array
          minItems: 2
          items: { type: string }
        correct_answer:
          type: string
          description: must be one of choices
        explanation: { type: string }

    Quiz:
      type: object
      additionalProperties: false
      required: [quiz_id, topic_id, questions]
      properties:
        quiz_id: { type: string }
        topic_id: { type: string }
        questions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuizQuestion" }

    SubmitQuizRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          items: { type: string }
          description: one answer per question, in the same order as Quiz.questions

    MasteryChange:
      type: object
      additionalProperties: false
      required: [topic_id, change]
      properties:
        topic_id: { type: string }
        change:
          type: number
          description: "positive = improved. Example 0.1 means +10 points"

    QuizResult:
      type: object
      additionalProperties: false
      required: [score, total, explanations, mastery_change]
      properties:
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        explanations:
          type: array
          items: { type: string }
          description: one per question, same order
        mastery_change:
          type: array
          items: { $ref: "#/components/schemas/MasteryChange" }

    NextStep:
      type: object
      additionalProperties: false
      required: [topic_id, suggestion]
      properties:
        topic_id: { type: string }
        suggestion: { type: string }

    WeakTopic:
      type: object
      additionalProperties: false
      required: [topic_id, score]
      properties:
        topic_id: { type: string }
        score:
          type: number
          minimum: 0
          maximum: 1
          description: mastery from 0 (none) to 1 (full). Low means weak.

    StudentSummary:
      type: object
      additionalProperties: false
      required: [weak_topics, level]
      properties:
        weak_topics:
          type: array
          items: { $ref: "#/components/schemas/WeakTopic" }
        level:
          type: string
          enum: [beginner, intermediate, advanced]

    QuestionEvent:
      type: object
      additionalProperties: false
      required: [user_id, room_id, topic_id, kind, text, time]
      properties:
        user_id: { type: string }
        room_id: { type: string }
        topic_id: { type: string }
        kind:
          type: string
          enum: [question, understood]
          description: understood exists only if proposal 4 is accepted
        text: { type: string }
        time: { type: string, format: date-time }

    # ---- M5 (placeholders, M5 confirms) --------------------------------------
    TopQuestion:
      type: object
      additionalProperties: false
      required: [topic_id, count, example]
      properties:
        topic_id: { type: string }
        count: { type: integer, minimum: 0 }
        example: { type: string }

    CommonMistake:
      type: object
      additionalProperties: false
      required: [topic_id, description]
      properties:
        topic_id: { type: string }
        description: { type: string }

    Insights:
      type: object
      additionalProperties: false
      required: [top_questions, common_mistakes]
      properties:
        top_questions:
          type: array
          items: { $ref: "#/components/schemas/TopQuestion" }
        common_mistakes:
          type: array
          items: { $ref: "#/components/schemas/CommonMistake" }

    ClassTopic:
      type: object
      additionalProperties: false
      required: [topic_id, mastery, status]
      properties:
        topic_id: { type: string }
        mastery: { type: number, minimum: 0, maximum: 1 }
        status:
          type: string
          enum: [on_track, watch, struggling]

    StudentAtRisk:
      type: object
      additionalProperties: false
      required: [user_id, name, topic_ids]
      properties:
        user_id: { type: string }
        name: { type: string }
        topic_ids:
          type: array
          items: { type: string }

    ClassReport:
      type: object
      additionalProperties: false
      required: [topics, students_at_risk]
      properties:
        topics:
          type: array
          items: { $ref: "#/components/schemas/ClassTopic" }
        students_at_risk:
          type: array
          items: { $ref: "#/components/schemas/StudentAtRisk" }

    TeacherAssistantRequest:
      type: object
      additionalProperties: false
      required: [room_id, request]
      properties:
        room_id: { type: string }
        request: { type: string }

    TeacherAssistant:
      type: object
      additionalProperties: false
      required: [draft_reply, status]
      properties:
        draft_reply: { type: string }
        status:
          type: string
          enum: [waiting_for_approval, approved, sent]

    # ------------------------------------------------- M5: profile + lecturer assistant
    TeacherDefaults:
      type: object
      additionalProperties: false
      required: [language, student_level, programming_language, duration_minutes]
      properties:
        language: { type: string, description: "Language the session is taught in, e.g. Arabic" }
        student_level: { type: string, enum: [beginner, intermediate, advanced] }
        programming_language: { type: string }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }

    TeacherProfileUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        teacher_id: { type: string, description: "Empty = new teacher (an id is made from the name)" }
        name: { type: string, minLength: 2 }
        title: { type: string, description: "e.g. د. or Eng." }
        subjects:
          type: array
          items: { type: string }
        bio: { type: string }
        avatar_filename: { type: string, description: "Saved presenter image for animated videos; empty = none. Served at /teacher/avatar/{teacher_id}" }
        defaults: { $ref: "#/components/schemas/TeacherDefaults" }

    TeacherProfile:
      type: object
      additionalProperties: false
      required: [teacher_id, name, title, subjects, bio, defaults, display_name, sessions_count, remembered]
      properties:
        teacher_id: { type: string }
        name: { type: string }
        title: { type: string }
        subjects:
          type: array
          items: { type: string }
        bio: { type: string }
        avatar_filename: { type: string, description: "Saved presenter image for animated videos; empty = none. Served at /teacher/avatar/{teacher_id}" }
        defaults: { $ref: "#/components/schemas/TeacherDefaults" }
        display_name: { type: string, description: "title + name, printed on every generated slide" }
        sessions_count: { type: integer, minimum: 0 }
        remembered:
          type: array
          description: What the assistant learned from approved sessions and change requests, shown to the teacher
          items: { type: string }

    VideoMoment:
      type: object
      additionalProperties: false
      required: [video_id, title, channel, thumbnail, start_sec, end_sec, open_at, text, score, url]
      properties:
        video_id: { type: string }
        title: { type: string }
        channel: { type: string }
        thumbnail: { type: string }
        start_sec: { type: number, minimum: 0 }
        end_sec: { type: number, minimum: 0 }
        open_at: { type: string, description: "mm:ss of start_sec" }
        text: { type: string, description: "The transcript excerpt that matched" }
        score: { type: number, description: "cosine similarity, higher = closer" }
        url: { type: string, description: "YouTube link that opens at start_sec" }

    VideoSearch:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/VideoMoment" }

    VideoJob:
      type: object
      additionalProperties: false
      required: [task_id, model, used_avatar]
      properties:
        task_id: { type: string }
        model: { type: string }
        used_avatar: { type: boolean, description: "true if the saved presenter image was the first frame" }
        asset_id: { type: string, description: "Library record of this job; only with a teacher token. A repeat of the same request returns the same job." }

    VideoJobStatus:
      type: object
      additionalProperties: false
      required: [status, video_url, error]
      properties:
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, ERROR, UNKNOWN, CANCELED] }
        video_url: { type: [string, "null"], description: "only when SUCCEEDED; valid for 24 hours" }
        error: { type: [string, "null"] }
        asset_id: { type: string, description: "Library record of this job; only with a teacher token" }
        file_url: { type: [string, "null"], description: "Set once the clip is saved on our server; it does not expire like video_url" }

    AvatarSaved:
      type: object
      additionalProperties: false
      required: [avatar_filename]
      properties:
        avatar_filename: { type: string }

    SessionFile:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    PastSession:
      type: object
      additionalProperties: false
      required: [session_id, topic, course_name, room_id, created_at, files]
      properties:
        session_id: { type: string }
        topic: { type: string }
        course_name: { type: string }
        room_id: { type: string, description: "Empty if the session is not linked to a room" }
        created_at: { type: string, description: "ISO date-time, empty for very old sessions" }
        files:
          type: array
          items: { $ref: "#/components/schemas/SessionFile" }

    TeacherSessions:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PastSession" }

    LecturerSessionRequest:
      type: object
      additionalProperties: false
      required: [lecturer_id, topic, needs]
      properties:
        lecturer_id: { type: string, minLength: 1, description: "= teacher_id" }
        lecturer_name: { type: string, description: "Printed on the slides. Empty = lecturer_id" }
        room_id: { type: string }
        topic: { type: string, minLength: 2 }
        course_name: { type: string }
        student_level: { type: string, enum: [beginner, intermediate, advanced] }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }
        language: { type: string }
        programming_language: { type: string }
        needs:
          type: array
          minItems: 1
          items: { type: string, enum: [slides, code, quiz] }
        num_quiz_questions: { type: integer, minimum: 1, maximum: 20 }
        learning_objectives:
          type: array
          items: { type: string }
        notes: { type: string }

    LecturerDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, revise] }
        feedback: { type: string, description: "Required (not empty) when decision is revise" }

    DraftSlide:
      type: object
      additionalProperties: false
      required: [title, bullets, notes, diagram_steps]
      properties:
        title: { type: string }
        bullets:
          type: array
          items: { type: string }
        notes: { type: string, description: Speaker notes }
        diagram_steps:
          type: array
          description: Optional flow drawn next to the bullets. Empty = no diagram
          items: { type: string }

    DraftCodeExample:
      type: object
      additionalProperties: false
      required: [title, code, explanation, verified, fix_attempts, output]
      properties:
        title: { type: string }
        code: { type: string }
        explanation: { type: string }
        verified:
          type: [boolean, "null"]
          description: true = it ran, false = still fails after fixes, null = not run (not Python)
        fix_attempts: { type: integer, minimum: 0 }
        output: { type: string, description: What the code printed }

    DraftQuizQuestion:
      type: object
      additionalProperties: false
      required: [question, options, answer_index, explanation]
      properties:
        question: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        answer_index: { type: integer, minimum: 0, maximum: 3 }
        explanation: { type: string }

    LecturerDraft:
      type: object
      additionalProperties: false
      required: [topic, course_name, language, outline, slides, code_examples, quiz]
      properties:
        topic: { type: string }
        course_name: { type: string }
        language: { type: string }
        outline:
          type: array
          items: { type: string }
        slides:
          type: array
          items: { $ref: "#/components/schemas/DraftSlide" }
        code_examples:
          type: array
          items: { $ref: "#/components/schemas/DraftCodeExample" }
        quiz:
          type: array
          items: { $ref: "#/components/schemas/DraftQuizQuestion" }

    LecturerSession:
      type: object
      additionalProperties: false
      required: [session_id, room_id, topic, status, selected_agents, reasoning, memory, draft,
                 revision_count, revisions_left, files]
      properties:
        session_id: { type: string }
        room_id: { type: string }
        topic: { type: string }
        status:
          type: string
          enum: [awaiting_approval, done, incomplete]
        selected_agents:
          type: array
          items: { type: string, enum: [research_agent, slides_agent, code_agent, quiz_agent] }
        reasoning: { type: string, description: Why the orchestrator chose these agents }
        memory:
          type: array
          description: What the assistant remembered about the teacher for this session
          items: { type: string }
        draft:
          description: Empty object only if the session stopped before a draft existed (status incomplete)
          anyOf:
            - { $ref: "#/components/schemas/LecturerDraft" }
            - { type: object, maxProperties: 0 }
        revision_count: { type: integer, minimum: 0 }
        revisions_left: { type: integer, minimum: 0 }
        files:
          type: array
          description: Filled when status is done
          items: { $ref: "#/components/schemas/SessionFile" }

    Asset:
      type: object
      additionalProperties: false
      required: [asset_id, kind, title, origin, status, error, source_url, start_sec, end_sec, provider, model, settings,
                 room_id, session_id, slide_index, parent_asset_id, version, file_url, created_at, updated_at]
      properties:
        asset_id: { type: string }
        kind: { type: string, enum: [pptx, code, quiz, image, source_video, generated_video, video, audio, theme] }
        title: { type: string }
        origin: { type: string, enum: [upload, external, edited, ai_generated], description: "Where it came from: provenance" }
        status: { type: string, enum: [pending, ready, failed] }
        error: { type: string, description: "Provider message when status is failed" }
        source_url: { type: string, description: "External material (e.g. YouTube); empty otherwise" }
        start_sec: { type: [number, "null"] }
        end_sec: { type: [number, "null"] }
        provider: { type: string, description: "AI provider for generated assets, e.g. qwencloud" }
        model: { type: string }
        settings: { type: object, description: "Generation settings (prompt, duration, audio ...)" }
        room_id: { type: string }
        session_id: { type: string }
        slide_index: { type: [integer, "null"] }
        parent_asset_id: { type: string, description: "Set on edited versions; the original is kept" }
        version: { type: integer, minimum: 1 }
        file_url: { type: [string, "null"], description: "Download route; null when there is no stored file" }
        created_at: { type: string }
        updated_at: { type: string }

    AssetList:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    AssetCreate:
      type: object
      additionalProperties: false
      required: [title, source_url]
      properties:
        kind: { type: string, enum: [source_video], default: source_video }
        title: { type: string, minLength: 1, maxLength: 200 }
        source_url: { type: string, pattern: "^https?://" }
        start_sec: { type: [number, "null"], minimum: 0 }
        end_sec: { type: [number, "null"], minimum: 0 }
        room_id: { type: string }
        session_id: { type: string }
        slide_index: { type: [integer, "null"], minimum: 0 }

    # ---- M5 studios (themes, decks, media, courses) --------------------------
    ThemeColors:
      type: object
      additionalProperties: false
      required: [ink, ink_soft, paper, line, blue, blue_soft, yellow, green, green_soft, code_bg, code_text]
      properties:
        ink: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        ink_soft: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        paper: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        line: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        blue: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        blue_soft: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        yellow: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        green: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        green_soft: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        code_bg: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        code_text: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }

    Theme:
      type: object
      additionalProperties: false
      required: [name, font, colors]
      properties:
        name: { type: string }
        font: { type: string }
        colors: { $ref: "#/components/schemas/ThemeColors" }

    ThemeEntry:
      type: object
      additionalProperties: false
      required: [theme_id, name, font, colors]
      properties:
        theme_id: { type: string, description: "preset:<key> for built-ins, the asset id for the teacher's own" }
        asset_id: { type: string, description: "Only for the teacher's own themes (library asset of kind theme)" }
        name: { type: string }
        font: { type: string }
        colors: { $ref: "#/components/schemas/ThemeColors" }

    ThemeList:
      type: object
      additionalProperties: false
      required: [presets, custom]
      properties:
        presets: { type: array, items: { $ref: "#/components/schemas/ThemeEntry" } }
        custom: { type: array, items: { $ref: "#/components/schemas/ThemeEntry" } }

    ThemeExtracted:
      allOf:
        - { $ref: "#/components/schemas/Asset" }
        - type: object
          required: [theme]
          properties:
            theme: { $ref: "#/components/schemas/Theme" }

    DeckSlide:
      type: object
      additionalProperties: false
      required: [title, bullets, notes, diagram_steps, image_asset_id, image_file_url]
      properties:
        title: { type: string, minLength: 1 }
        bullets: { type: array, items: { type: string } }
        notes: { type: string }
        diagram_steps: { type: array, items: { type: string } }
        image_asset_id: { type: string, description: "A library image of this teacher; empty = none" }
        image_file_url: { type: [string, "null"] }

    Deck:
      type: object
      additionalProperties: false
      required: [deck_id, title, course_name, room_id, session_id, theme_id, theme_name, theme, slides, slide_count, pptx_asset_id, exports, created_at, updated_at]
      properties:
        deck_id: { type: string }
        title: { type: string }
        course_name: { type: string }
        room_id: { type: string }
        session_id: { type: string, description: "The finished lesson the deck came from" }
        theme_id: { type: string }
        theme_name: { type: string }
        theme: { $ref: "#/components/schemas/Theme" }
        slides: { type: array, items: { $ref: "#/components/schemas/DeckSlide" } }
        slide_count: { type: integer, minimum: 0 }
        pptx_asset_id: { type: string, description: "Latest .pptx of this lesson in the library" }
        exports: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }

    DeckList:
      type: object
      additionalProperties: false
      required: [decks]
      properties:
        decks: { type: array, items: { $ref: "#/components/schemas/Deck" } }

    DeckCreate:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 80 }

    DeckUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        theme_id: { type: string, maxLength: 60 }
        slides:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              bullets: { type: array, items: { type: string } }
              notes: { type: string }
              diagram_steps: { type: array, items: { type: string } }
              image_asset_id: { type: string }

    SlideImage:
      type: object
      additionalProperties: false
      properties:
        asset_id: { type: string, maxLength: 40 }

    VisualRequest:
      type: object
      additionalProperties: false
      properties:
        prompt: { type: string, maxLength: 600, description: "Empty = the LLM writes it from the slide text" }

    VisualJob:
      type: object
      additionalProperties: false
      required: [task_id, asset_id, prompt, used_llm]
      properties:
        task_id: { type: string }
        asset_id: { type: string }
        prompt: { type: string }
        used_llm: { type: boolean }

    VisualStatus:
      type: object
      additionalProperties: false
      required: [status, asset_id, file_url, error, deck_id, slide_index]
      properties:
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED, ERROR] }
        asset_id: { type: string }
        file_url: { type: [string, "null"] }
        error: { type: [string, "null"] }
        deck_id: { type: string }
        slide_index: { type: [integer, "null"] }

    MediaCapabilities:
      type: object
      additionalProperties: false
      required: [image_editing, ffmpeg, speech, voices]
      properties:
        image_editing: { type: boolean }
        ffmpeg: { type: boolean, description: "Video and audio editing need ffmpeg on the server" }
        speech: { type: boolean, description: "edge-tts is installed" }
        voices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [voice, label]
            properties:
              voice: { type: string }
              label: { type: string }

    ThumbnailRequest:
      type: object
      additionalProperties: false
      required: [video_id]
      properties:
        video_id: { type: string, pattern: "^[A-Za-z0-9_-]{11}$" }
        title: { type: string, maxLength: 200 }
        start_sec: { type: [number, "null"], minimum: 0 }
        room_id: { type: string, maxLength: 60 }

    SpeechRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 2, maxLength: 3000 }
        voice: { type: string }
        title: { type: string, maxLength: 200 }
        room_id: { type: string, maxLength: 60 }

    MediaEdit:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        ops:
          type: object
          description: "Image: crop {x,y,w,h} in percent, rotate 0|90|180|270, flip h|v|both, width px, brightness, contrast, grayscale (not for GIFs). Video/audio: trim {start,end} seconds, mute, volume, extract_audio. Video only: to_gif (with optional trim, fps, width) makes a looping GIF image asset that can go on a slide."
          additionalProperties: true

    CourseLesson:
      type: object
      additionalProperties: false
      required: [lesson_id, title, notes, session_id, assets]
      properties:
        lesson_id: { type: string }
        title: { type: string }
        notes: { type: string }
        session_id: { type: string }
        assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }

    Course:
      type: object
      additionalProperties: false
      required: [course_id, title, description, room_id, published_room_id, published_at, unpublished_changes, lessons, created_at, updated_at]
      properties:
        course_id: { type: string }
        title: { type: string }
        description: { type: string }
        room_id: { type: string }
        published_room_id: { type: string, description: "Empty = a draft students cannot see" }
        published_at: { type: string }
        unpublished_changes: { type: boolean, description: "Edited after publishing: publish again so students see it" }
        lessons: { type: array, items: { $ref: "#/components/schemas/CourseLesson" } }
        created_at: { type: string }
        updated_at: { type: string }

    CourseList:
      type: object
      additionalProperties: false
      required: [courses]
      properties:
        courses: { type: array, items: { $ref: "#/components/schemas/Course" } }

    CourseCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        room_id: { type: string, maxLength: 60 }

    CourseUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        room_id: { type: string, maxLength: 60 }

    LessonCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        notes: { type: string, maxLength: 2000 }
        session_id: { type: string, maxLength: 80 }
        asset_ids: { type: array, maxItems: 20, items: { type: string } }

    LessonUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 160 }
        notes: { type: string, maxLength: 2000 }

    LessonMove:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction: { type: string, enum: [up, down] }

    LessonAsset:
      type: object
      additionalProperties: false
      properties:
        add: { type: string, maxLength: 40 }
        remove: { type: string, maxLength: 40 }

    PublishRequest:
      type: object
      additionalProperties: false
      required: [room_id]
      properties:
        room_id: { type: string, minLength: 1, maxLength: 60 }

    RoomCourseAsset:
      type: object
      additionalProperties: false
      required: [asset_id, title, kind, source_url, start_sec, end_sec, file_url]
      properties:
        asset_id: { type: string }
        title: { type: string }
        kind: { type: string }
        source_url: { type: string }
        start_sec: { type: [number, "null"] }
        end_sec: { type: [number, "null"] }
        file_url: { type: [string, "null"] }

    RoomCourses:
      type: object
      additionalProperties: false
      required: [courses]
      properties:
        courses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [course_id, title, description, published_at, lessons]
            properties:
              course_id: { type: string }
              title: { type: string }
              description: { type: string }
              published_at: { type: string }
              lessons:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [lesson_id, title, notes, assets]
                  properties:
                    lesson_id: { type: string }
                    title: { type: string }
                    notes: { type: string }
                    assets: { type: array, items: { $ref: "#/components/schemas/RoomCourseAsset" } }

    StoryCreate:
      type: object
      additionalProperties: false
      required: [topic]
      properties:
        topic: { type: string, minLength: 3, maxLength: 400 }
        scenes: { type: integer, minimum: 2, maximum: 8, default: 6, description: "About 5 seconds each" }
        style: { type: string, enum: [storybook, flat, clay, realistic], default: storybook }
        language: { type: string, enum: [ar, en], default: ar, description: "Language of the narration" }
        voice: { type: string, maxLength: 60, description: "An edge-tts voice from /teacher/media/capabilities; empty = no narration" }
        fade: { type: boolean, default: true }
        vision: { type: boolean, default: false, description: "Describe each last frame with a local vision model (Ollama) to keep the next scene consistent" }
        room_id: { type: string, maxLength: 60 }
        retry: { type: boolean, default: false }

    StoryScene:
      type: object
      additionalProperties: false
      required: [n, state, narration, visual]
      properties:
        n: { type: integer, minimum: 1 }
        state: { type: string, enum: [todo, running, done] }
        narration: { type: string }
        visual: { type: string }

    StoryStatus:
      type: object
      additionalProperties: false
      required: [asset_id, title, status, error, scene_count, scenes_done, style, topic, voice, fade, vision, narrated, scenes, file_url]
      properties:
        asset_id: { type: string, description: "The story is a library video (kind generated_video)" }
        title: { type: string }
        status: { type: string, enum: [pending, ready, failed] }
        error: { type: string }
        scene_count: { type: integer, minimum: 0 }
        scenes_done: { type: integer, minimum: 0 }
        style: { type: string }
        topic: { type: string }
        voice: { type: string }
        fade: { type: boolean }
        vision: { type: boolean }
        narrated: { type: boolean }
        scenes: { type: array, items: { $ref: "#/components/schemas/StoryScene" } }
        file_url: { type: [string, "null"], description: "Set when status is ready" }
