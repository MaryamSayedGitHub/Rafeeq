              schema: { $ref: "#/components/schemas/Course" }
        "404": { description: Not found (or not yours) }
        "422": { description: Invalid input }

  /teacher/courses/{course_id}/lessons/{lesson_id}/assets:
    post:
      tags: [M5 teacher]
      operationId: setLessonAssets
      summary: "Add and/or remove one library item of a lesson."
      security: [{ bearerAuth: [] }]
      parameters:
