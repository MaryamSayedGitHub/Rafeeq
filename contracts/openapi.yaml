# Rafeeq API contract: DRAFT v0 for the contracts meeting.
# Every field here is a proposal until the team agrees it. After the meeting,
# M1 commits the agreed version and tags it day1-contracts.
#
# How to read this file:
#   paths       = the routes (addresses) of the app, grouped by owner (tags)
#   components  = the JSON shapes ("schemas"). Each one matches a file in contracts/samples/
#   Every schema has additionalProperties: false, so a typo such as "pages" instead
#   of "page" makes the contract test fail instead of passing silently.
openapi: 3.1.0
info:
  title: Rafeeq API
  version: 0.1.0-draft
  description: Contract between the five parts of Rafeeq. Draft v0.
servers:
  - url: http://127.0.0.1:8000
security:
  - bearerAuth: []

tags:
  - name: M1 platform
  - name: M2 knowledge
  - name: M3 tutor
  - name: M4 quiz and profile
  - name: M5 teacher

paths:
  # ---------------------------------------------------------------- M1
  /auth/login:
    post:
      tags: [M1 platform]
      operationId: login
      summary: Log in. Returns a token that every other call sends in the Authorization header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sample file samples/login.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Login" }
        "401": { description: Wrong email or password }

  /rooms:
    get:
      tags: [M1 platform]
      operationId: listMyRooms
      summary: The rooms of the logged-in user (course rooms and, if proposal 1 is accepted, My own study).
      responses:
        "200":
          description: Sample file samples/my_rooms.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyRooms" }
    post:
      tags: [M1 platform]
      operationId: createRoom
      summary: A teacher creates a room and gets its join code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "200":
          description: Sample file samples/create_room.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateRoomResult" }              

  /rooms/{room_id}/files:
    post:
      tags: [M1 platform]
      operationId: uploadFile
      summary: Upload a course file into a room. M1 stores it, then asks M2 to index it.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
    get:
      tags: [M1 platform]
      operationId: listRoomFiles
      summary: The room's files with their indexing status.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_files.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomFiles" }
      responses:
        "202":
          description: Sample file samples/upload_file.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFile" }
  /auth/register:
    post:
      tags: [M1 platform]
      operationId: register
      summary: Create a student or teacher account. Returns the same thing as login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Sample file samples/register.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Login" }
        "400": { description: Missing name, invalid email, short password, or unknown join code }
        "409": { description: An account with this email already exists }

  /rooms/join:
    post:
      tags: [M1 platform]
      operationId: joinRoom
      summary: A student joins a room with the teacher's code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRoomRequest" }
      responses:
        "200":
          description: Sample file samples/join_room.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /rooms/{room_id}/join-code:
    get:
      tags: [M1 platform]
      operationId: getJoinCode
      summary: The room's current join code. Teacher of the room only.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/join_code.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCode" }
        "403": { description: Not the teacher of this room }

  /rooms/{room_id}/students:
    get:
      tags: [M1 platform]
      operationId: listRoomStudents
      summary: Students in the room with activity and mastery. Teacher only.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_students.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomStudents" }
  /snap:
    post:
      tags: [M1 platform]
      operationId: snapAndAsk
      summary: Read a photo. OpenCV cleans it, a vision-language model returns the text and what kind of photo it is.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                room_id: { type: string }
      responses:
        "200":
          description: Sample file samples/snap_result.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapResult" }
        "422": { description: The upload is not an image }
        "503": { description: No image reader is configured (neither M3's OCR nor a vision model) }

  /copilot/message:
    post:
      tags: [M1 platform]
      operationId: copilotMessage
      summary: The one entry point for the student. The Copilot picks a route and calls the right part.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotRequest" }
      responses:
        "200":
          description: Sample file samples/copilot_reply.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotReply" }

  # ---------------------------------------------------------------- M2
  /search:
    post:
      tags: [M2 knowledge]
      operationId: searchMaterial
      summary: Find the pieces of course material that answer a question.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Sample file samples/search_material.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchMaterial" }

  /rooms/{room_id}/topics:
    get:
      tags: [M2 knowledge]
      operationId: listTopics
      summary: The topics found in the room's material. M4 and M5 use the topic ids.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_topics.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomTopics" }

  /sources/page:
    get:
      tags: [M2 knowledge]
      operationId: getSourcePage
      summary: Open the exact page a citation points to.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { name: file_name, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Sample file samples/source_page.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }

  # ---------------------------------------------------------------- M3
  /tutor/answer:
    post:
      tags: [M3 tutor]
      operationId: tutorAnswer
      summary: Answer a question using only the room's material. Called by the Copilot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorRequest" }
      responses:
        "200":
          description: Sample file samples/tutor_answer.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorAnswer" }

  /tutor/check-work:
    post:
      tags: [M3 tutor]
      operationId: checkWork
      summary: Check a photo of the student's own work. Marks the first wrong step and gives a hint, not the solution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckWorkRequest" }
      responses:
        "200":
          description: Sample file samples/handwriting_check.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandwritingCheck" }

  # ---------------------------------------------------------------- M4
  /quiz:
    post:
      tags: [M4 quiz and profile]
      operationId: makeQuiz
      summary: Make a quiz on one topic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakeQuizRequest" }
      responses:
        "200":
          description: Sample file samples/make_quiz.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }

  /quiz/{quiz_id}/submit:
    post:
      tags: [M4 quiz and profile]
      operationId: submitQuiz
      summary: Send the student's answers. Returns the score and how mastery changed.
      parameters:
        - { name: quiz_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitQuizRequest" }
      responses:
        "200":
          description: Sample file samples/submit_quiz.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }

  /next-step:
    get:
      tags: [M4 quiz and profile]
      operationId: nextStep
      summary: What the student should do next. Feeds the Today card on the home page.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/next_step.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStep" }

  /profile/summary:
    get:
      tags: [M4 quiz and profile]
      operationId: profileSummary
      summary: PROPOSAL 2. Read-only summary of the student, so the tutor can adapt. Called by M3.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/student_summary.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }

  /events:
    post:
      tags: [M4 quiz and profile]
      operationId: recordEvent
      summary: PROPOSAL 3. M3 tells M4 that the student asked a question (later also "understood").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionEvent" }
      responses:
        "204":
          description: Recorded. No body. The request body is samples/question_event.json

  # ---------------------------------------------------------------- M5
  # Insights / report / assistant: placeholders until M5 confirms.
  # Profile and sessions: the lecturer assistant (LangGraph), implemented in rafeeq/teacher.
  # Until M1's login exists, teacher_id is sent explicitly; afterwards it comes from the token.
  /teacher/profile:
    get:
      tags: [M5 teacher]
      operationId: getTeacherProfile
      summary: The teacher's profile, defaults for new sessions, and what the assistant remembers.
      parameters:
        - { $ref: "#/components/parameters/TeacherId" }
      responses:
        "200":
          description: Sample file samples/teacher_profile.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "404": { description: This teacher has no profile yet }
    put:
      tags: [M5 teacher]
      operationId: saveTeacherProfile
      summary: Create or update the profile. An empty teacher_id creates a new teacher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherProfileUpdate" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }

  /teacher/sessions:
    get:
      tags: [M5 teacher]
      operationId: listTeacherSessions
      summary: Finished (approved) sessions of a teacher, newest first, with their files.
      parameters:
        - { $ref: "#/components/parameters/TeacherId" }
      responses:
        "200":
          description: Sample file samples/teacher_sessions.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSessions" }
    post:
      tags: [M5 teacher]
      operationId: startLecturerSession
      summary: Prepare a teaching session. Runs the agents and returns when the draft waits for review (can take 1-2 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LecturerSessionRequest" }
      responses:
        "200":
          description: Sample file samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "503": { description: No LLM provider is configured on the server }

  /teacher/sessions/{session_id}:
    get:
      tags: [M5 teacher]
      operationId: getLecturerSession
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Same shape as samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "404": { description: Unknown session }

  /teacher/sessions/{session_id}/decision:
    post:
      tags: [M5 teacher]
      operationId: decideLecturerSession
      summary: approve -> the files are created (status done). revise -> a new draft is built from the feedback.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LecturerDecision" }
      responses:
        "200":
          description: Same shape as samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "404": { description: Unknown session }
        "409": { description: Not waiting for a decision, or the revision limit is reached }

  /teacher/sessions/{session_id}/files/{name}:
    get:
      tags: [M5 teacher]
      operationId: downloadLecturerFile
      summary: Download a generated file (.pptx, code file, quiz.json, quiz.md). Only names listed in the session.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream: {}
        "404": { description: Unknown session or file }

  /teacher/rooms/{room_id}/insights:
    get:
      tags: [M5 teacher]
      operationId: teacherInsights
      summary: What students ask about and which mistakes repeat.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/insights.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insights" }

  /teacher/rooms/{room_id}/report:
    get:
      tags: [M5 teacher]
      operationId: teacherReport
      summary: How the class is doing per topic, and who is at risk.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/class_report.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassReport" }

  /teacher/assistant:
    post:
      tags: [M5 teacher]
      operationId: teacherAssistant
      summary: The teacher asks for something (a reply, a summary). The assistant drafts it and waits for approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherAssistantRequest" }
      responses:
        "200":
          description: Sample file samples/teacher_assistant.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherAssistant" }

  /teacher/videos/search:
    get:
      tags: [M5 teacher]
      operationId: searchTeachingVideos
      summary: YouTube videos for a question, each opening at the second whose transcript answers it.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 300 } }
        - { name: top_k, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        "200":
          description: Sample file samples/video_search.json. Empty results (not an error) when search or embeddings are unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoSearch" }

  /teacher/videos/generate:
    post:
      tags: [M5 teacher]
      operationId: generateVideo
      summary: Start an animated video (paid, async). Without an image, the teacher's presenter image is the first frame if saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prompt]
              properties:
                teacher_id: { type: string }
                prompt: { type: string, minLength: 3, maxLength: 800 }
                duration: { type: integer, minimum: 2, maximum: 6, default: 5 }
                audio: { type: boolean, default: false }
                image: { type: string, format: binary }
      responses:
        "200":
          description: Sample file samples/video_job.json. 503 when DASHSCOPE_API_KEY is not set, 502 when the provider refuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }

  /teacher/videos/generate/{task_id}:
    get:
      tags: [M5 teacher]
      operationId: videoJobStatus
      summary: Poll an animated video job until it is no longer PENDING or RUNNING.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file samples/video_job_status.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJobStatus" }

  /teacher/avatar:
    post:
      tags: [M5 teacher]
      operationId: saveTeacherAvatar
      summary: Save the teacher's presenter image (first frame of their animated videos).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [teacher_id, image]
              properties:
                teacher_id: { type: string }
                image: { type: string, format: binary }
      responses:
        "200":
          description: Sample file samples/avatar_saved.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarSaved" }

  /teacher/avatar/{teacher_id}:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAvatar
      summary: The saved presenter image. 404 if the teacher has none.
      parameters:
        - { name: teacher_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image file
          content:
            image/*:
              schema: { type: string, format: binary }

  /teacher/assets:
    get:
      tags: [M5 teacher]
      operationId: listTeacherAssets
      summary: The teacher's library (saved and generated files, videos, video moments). Needs the teacher's Bearer token.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [pptx, code, quiz, image, source_video, generated_video, audio] } }
        - { name: room_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, ready, failed] } }
      responses:
        "200":
          description: Sample file samples/assets.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "401": { description: Not signed in as a teacher }
    post:
      tags: [M5 teacher]
      operationId: createTeacherAsset
      summary: Save an external video moment (e.g. a YouTube result) to the library. Repeating the same request returns the same asset.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetCreate" }
      responses:
        "201":
          description: Sample file samples/asset.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { description: Not signed in as a teacher }
        "422": { description: Invalid input }

  /teacher/assets/{asset_id}:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAsset
      summary: One asset of this teacher. Another teacher's asset is 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file samples/asset.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { description: No such asset }

  /teacher/assets/{asset_id}/file:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAssetFile
      summary: The stored file of an asset. 404 for external material or a file that is not ready.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: No such asset or no file }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TeacherId:
      name: teacher_id
      in: query
      required: true
      description: Until M1's login exists. Afterwards the teacher comes from the token.
      schema: { type: string }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    RoomId:
      name: room_id
      in: path
      required: true
      schema: { type: string }

  schemas:
    # ---- shared small pieces ------------------------------------------------
    Language:
      type: string
      enum: [ar, en]
    Role:
      type: string
      enum: [student, teacher]

    # ---- M1 ------------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Login:
      type: object
      additionalProperties: false
      required: [token, user_id, name, role]
      properties:
        token: { type: string }
        user_id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Room:
      type: object
      additionalProperties: false
      required: [room_id, name, kind, files_ready]
      properties:
        room_id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [course, personal]
          description: "personal exists only if proposal 1 is accepted"
        files_ready:
          type: integer
          minimum: 0
          description: how many files in the room are indexed and ready

    MyRooms:
      type: object
      additionalProperties: false
      required: [rooms]
      properties:
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        join_code: { type: string, description: "optional, students only" }

    JoinRoomRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }

    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }

    CreateRoomResult:
      type: object
      additionalProperties: false
      required: [room, join_code]
      properties:
        room: { $ref: "#/components/schemas/Room" }
        join_code: { type: string }

    JoinCode:
      type: object
      additionalProperties: false
      required: [join_code]
      properties:
        join_code: { type: string, description: "e.g. K7Q-4MX" }

    RoomFile:
      type: object
      additionalProperties: false
      required: [file_id, name, source, status]
      properties:
        file_id: { type: string }
        name: { type: string }
        source: { type: string, enum: [teacher, assistant] }
        status: { type: string, enum: [uploaded, indexing, ready, failed] }

    RoomFiles:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: "#/components/schemas/RoomFile" }

    RoomStudent:
      type: object
      additionalProperties: false
      required: [user_id, name, questions_this_week, mastery, status]
      properties:
        user_id: { type: string }
        name: { type: string }
        questions_this_week: { type: integer, minimum: 0 }
        mastery:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: from M4. null until M4 has data for this student
        status:
          type: [string, "null"]
          enum: [on_track, watch, struggling, null]
          description: from M4. null until M4 has data for this student

    RoomStudents:
      type: object
      additionalProperties: false
      required: [students]
      properties:
        students:
          type: array
          items: { $ref: "#/components/schemas/RoomStudent" }
    UploadFile:
      type: object
      additionalProperties: false
      required: [file_id, status]
      properties:
        file_id: { type: string }
        status:
          type: string
          enum: [uploaded, indexing, ready, failed]

    SnapResult:
      type: object
      additionalProperties: false
      required: [file_id, type, language, text, confidence]
      properties:
        file_id: { type: string }
        type:
          type: string
          enum: [student_work, material, diagram, other]
        language: { $ref: "#/components/schemas/Language" }
        text: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1

    CopilotRequest:
      type: object
      additionalProperties: false
      required: [room_id, text]
      properties:
        room_id: { type: string }
        text: { type: string }
        file_id:
          type: string
          description: set when the student attached a photo (the Snap result id)
        mode:
          type: string
          enum: [auto, ask, check_work]
          default: auto
          description: >
            auto = the Copilot decides. ask / check_work = the student chose explicitly
            ("explain this photo" vs "check my solution"), so the Copilot skips classification.

    CopilotReply:
      type: object
      additionalProperties: false
      required: [route, reply, payload]
      properties:
        route:
          type: string
          enum: [ask, quiz, check_work, plan, clarify]
        reply:
          type: string
          description: short text shown in the chat
        payload:
          type: object
          description: >
            Depends on route. ask = a TutorAnswer, quiz = {quiz_id, topic_id},
            check_work = a HandwritingCheck, plan = {topic_id}, clarify = {}.
            Extra flags the UI reads: sample (true when the result is a contract sample because
            the owning service is not connected yet), unavailable, needs_photo,
            escalated + question_id, verified_by_teacher.
          additionalProperties: true

    # ---- M2 ------------------------------------------------------------------
    SearchRequest:
      type: object
      additionalProperties: false
      required: [room_id, query]
      properties:
        room_id: { type: string }
        query: { type: string }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }

    Chunk:
      type: object
      additionalProperties: false
      required: [file_name, page, text, topic_id]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        topic_id: { type: string }

    SearchMaterial:
      type: object
      additionalProperties: false
      required: [chunks]
      properties:
        chunks:
          type: array
          items: { $ref: "#/components/schemas/Chunk" }

    Topic:
      type: object
      additionalProperties: false
      required: [topic_id, name]
      properties:
        topic_id: { type: string }
        name: { type: string }

    RoomTopics:
      type: object
      additionalProperties: false
      required: [topics]
      properties:
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }

    SourcePage:
      type: object
      additionalProperties: false
      required: [file_name, page]
      anyOf:
        - required: [text]
        - required: [image_url]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        image_url: { type: string }

    # ---- M3 ------------------------------------------------------------------
    TutorRequest:
      type: object
      additionalProperties: false
      required: [room_id, question]
      properties:
        room_id: { type: string }
        question: { type: string }
        language: { $ref: "#/components/schemas/Language" }

    Citation:
      type: object
      additionalProperties: false
      required: [file_name, page]
      properties:
        file_name: { type: string }
        page: { type: integer, minimum: 1 }

    TutorAnswer:
      type: object
      additionalProperties: false
      required: [answer, citations, grounded, steps]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        grounded:
          type: boolean
          description: false when the material did not contain the answer
        steps:
          type: array
          items: { type: string }
          description: PROPOSAL 4. Empty list means one full answer, no step-by-step mode.

    CheckWorkRequest:
      type: object
      additionalProperties: false
      required: [room_id, file_id, text]
      properties:
        room_id: { type: string }
        file_id: { type: string }
        text:
          type: string
          description: the text read from the photo (SnapResult.text)

    Box:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: A rectangle on the photo. All four numbers are fractions of the image size, from 0 to 1.
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }

    WorkStep:
      type: object
      additionalProperties: false
      required: [text, correct]
      properties:
        text: { type: string }
        correct: { type: boolean }

    HandwritingCheck:
      type: object
      additionalProperties: false
      required: [boxes, steps, hint]
      properties:
        boxes:
          type: array
          description: marks the first wrong step. Empty if all steps are correct.
          items: { $ref: "#/components/schemas/Box" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkStep" }
        hint:
          type: string
          description: a nudge, never the full solution

    # ---- M4 ------------------------------------------------------------------
    MakeQuizRequest:
      type: object
      additionalProperties: false
      required: [room_id, topic_id]
      properties:
        room_id: { type: string }
        topic_id: { type: string }
        count: { type: integer, minimum: 1, maximum: 20, default: 5 }

    QuizQuestion:
      type: object
      additionalProperties: false
      required: [text, choices, correct_answer, explanation]
      properties:
        text: { type: string }
        choices:
          type: array
          minItems: 2
          items: { type: string }
        correct_answer:
          type: string
          description: must be one of choices
        explanation: { type: string }

    Quiz:
      type: object
      additionalProperties: false
      required: [quiz_id, topic_id, questions]
      properties:
        quiz_id: { type: string }
        topic_id: { type: string }
        questions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuizQuestion" }

    SubmitQuizRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          items: { type: string }
          description: one answer per question, in the same order as Quiz.questions

    MasteryChange:
      type: object
      additionalProperties: false
      required: [topic_id, change]
      properties:
        topic_id: { type: string }
        change:
          type: number
          description: "positive = improved. Example 0.1 means +10 points"

    QuizResult:
      type: object
      additionalProperties: false
      required: [score, total, explanations, mastery_change]
      properties:
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        explanations:
          type: array
          items: { type: string }
          description: one per question, same order
        mastery_change:
          type: array
          items: { $ref: "#/components/schemas/MasteryChange" }

    NextStep:
      type: object
      additionalProperties: false
      required: [topic_id, suggestion]
      properties:
        topic_id: { type: string }
        suggestion: { type: string }

    WeakTopic:
      type: object
      additionalProperties: false
      required: [topic_id, score]
      properties:
        topic_id: { type: string }
        score:
          type: number
          minimum: 0
          maximum: 1
          description: mastery from 0 (none) to 1 (full). Low means weak.

    StudentSummary:
      type: object
      additionalProperties: false
      required: [weak_topics, level]
      properties:
        weak_topics:
          type: array
          items: { $ref: "#/components/schemas/WeakTopic" }
        level:
          type: string
          enum: [beginner, intermediate, advanced]

    QuestionEvent:
      type: object
      additionalProperties: false
      required: [user_id, room_id, topic_id, kind, text, time]
      properties:
        user_id: { type: string }
        room_id: { type: string }
        topic_id: { type: string }
        kind:
          type: string
          enum: [question, understood]
          description: understood exists only if proposal 4 is accepted
        text: { type: string }
        time: { type: string, format: date-time }

    # ---- M5 (placeholders, M5 confirms) --------------------------------------
    TopQuestion:
      type: object
      additionalProperties: false
      required: [topic_id, count, example]
      properties:
        topic_id: { type: string }
        count: { type: integer, minimum: 0 }
        example: { type: string }

    CommonMistake:
      type: object
      additionalProperties: false
      required: [topic_id, description]
      properties:
        topic_id: { type: string }
        description: { type: string }

    Insights:
      type: object
      additionalProperties: false
      required: [top_questions, common_mistakes]
      properties:
        top_questions:
          type: array
          items: { $ref: "#/components/schemas/TopQuestion" }
        common_mistakes:
          type: array
          items: { $ref: "#/components/schemas/CommonMistake" }

    ClassTopic:
      type: object
      additionalProperties: false
      required: [topic_id, mastery, status]
      properties:
        topic_id: { type: string }
        mastery: { type: number, minimum: 0, maximum: 1 }
        status:
          type: string
          enum: [on_track, watch, struggling]

    StudentAtRisk:
      type: object
      additionalProperties: false
      required: [user_id, name, topic_ids]
      properties:
        user_id: { type: string }
        name: { type: string }
        topic_ids:
          type: array
          items: { type: string }

    ClassReport:
      type: object
      additionalProperties: false
      required: [topics, students_at_risk]
      properties:
        topics:
          type: array
          items: { $ref: "#/components/schemas/ClassTopic" }
        students_at_risk:
          type: array
          items: { $ref: "#/components/schemas/StudentAtRisk" }

    TeacherAssistantRequest:
      type: object
      additionalProperties: false
      required: [room_id, request]
      properties:
        room_id: { type: string }
        request: { type: string }

    TeacherAssistant:
      type: object
      additionalProperties: false
      required: [draft_reply, status]
      properties:
        draft_reply: { type: string }
        status:
          type: string
          enum: [waiting_for_approval, approved, sent]

    # ------------------------------------------------- M5: profile + lecturer assistant
    TeacherDefaults:
      type: object
      additionalProperties: false
      required: [language, student_level, programming_language, duration_minutes]
      properties:
        language: { type: string, description: "Language the session is taught in, e.g. Arabic" }
        student_level: { type: string, enum: [beginner, intermediate, advanced] }
        programming_language: { type: string }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }

    TeacherProfileUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        teacher_id: { type: string, description: "Empty = new teacher (an id is made from the name)" }
        name: { type: string, minLength: 2 }
        title: { type: string, description: "e.g. د. or Eng." }
        subjects:
          type: array
          items: { type: string }
        bio: { type: string }
        avatar_filename: { type: string, description: "Saved presenter image for animated videos; empty = none. Served at /teacher/avatar/{teacher_id}" }
        defaults: { $ref: "#/components/schemas/TeacherDefaults" }

    TeacherProfile:
      type: object
      additionalProperties: false
      required: [teacher_id, name, title, subjects, bio, defaults, display_name, sessions_count, remembered]
      properties:
        teacher_id: { type: string }
        name: { type: string }
        title: { type: string }
        subjects:
          type: array
          items: { type: string }
        bio: { type: string }
        avatar_filename: { type: string, description: "Saved presenter image for animated videos; empty = none. Served at /teacher/avatar/{teacher_id}" }
        defaults: { $ref: "#/components/schemas/TeacherDefaults" }
        display_name: { type: string, description: "title + name, printed on every generated slide" }
        sessions_count: { type: integer, minimum: 0 }
        remembered:
          type: array
          description: What the assistant learned from approved sessions and change requests, shown to the teacher
          items: { type: string }

    VideoMoment:
      type: object
      additionalProperties: false
      required: [video_id, title, channel, thumbnail, start_sec, end_sec, open_at, text, score, url]
      properties:
        video_id: { type: string }
        title: { type: string }
        channel: { type: string }
        thumbnail: { type: string }
        start_sec: { type: number, minimum: 0 }
        end_sec: { type: number, minimum: 0 }
        open_at: { type: string, description: "mm:ss of start_sec" }
        text: { type: string, description: "The transcript excerpt that matched" }
        score: { type: number, description: "cosine similarity, higher = closer" }
        url: { type: string, description: "YouTube link that opens at start_sec" }

    VideoSearch:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/VideoMoment" }

    VideoJob:
      type: object
      additionalProperties: false
      required: [task_id, model, used_avatar]
      properties:
        task_id: { type: string }
        model: { type: string }
        used_avatar: { type: boolean, description: "true if the saved presenter image was the first frame" }
        asset_id: { type: string, description: "Library record of this job; only with a teacher token. A repeat of the same request returns the same job." }

    VideoJobStatus:
      type: object
      additionalProperties: false
      required: [status, video_url, error]
      properties:
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, ERROR, UNKNOWN, CANCELED] }
        video_url: { type: [string, "null"], description: "only when SUCCEEDED; valid for 24 hours" }
        error: { type: [string, "null"] }
        asset_id: { type: string, description: "Library record of this job; only with a teacher token" }
        file_url: { type: [string, "null"], description: "Set once the clip is saved on our server; it does not expire like video_url" }

    AvatarSaved:
      type: object
      additionalProperties: false
      required: [avatar_filename]
      properties:
        avatar_filename: { type: string }

    SessionFile:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    PastSession:
      type: object
      additionalProperties: false
      required: [session_id, topic, course_name, room_id, created_at, files]
      properties:
        session_id: { type: string }
        topic: { type: string }
        course_name: { type: string }
        room_id: { type: string, description: "Empty if the session is not linked to a room" }
        created_at: { type: string, description: "ISO date-time, empty for very old sessions" }
        files:
          type: array
          items: { $ref: "#/components/schemas/SessionFile" }

    TeacherSessions:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PastSession" }

    LecturerSessionRequest:
      type: object
      additionalProperties: false
      required: [lecturer_id, topic, needs]
      properties:
        lecturer_id: { type: string, minLength: 1, description: "= teacher_id" }
        lecturer_name: { type: string, description: "Printed on the slides. Empty = lecturer_id" }
        room_id: { type: string }
        topic: { type: string, minLength: 2 }
        course_name: { type: string }
        student_level: { type: string, enum: [beginner, intermediate, advanced] }
        duration_minutes: { type: integer, minimum: 15, maximum: 240 }
        language: { type: string }
        programming_language: { type: string }
        needs:
          type: array
          minItems: 1
          items: { type: string, enum: [slides, code, quiz] }
        num_quiz_questions: { type: integer, minimum: 1, maximum: 20 }
        learning_objectives:
          type: array
          items: { type: string }
        notes: { type: string }

    LecturerDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, revise] }
        feedback: { type: string, description: "Required (not empty) when decision is revise" }

    DraftSlide:
      type: object
      additionalProperties: false
      required: [title, bullets, notes, diagram_steps]
      properties:
        title: { type: string }
        bullets:
          type: array
          items: { type: string }
        notes: { type: string, description: Speaker notes }
        diagram_steps:
          type: array
          description: Optional flow drawn next to the bullets. Empty = no diagram
          items: { type: string }

    DraftCodeExample:
      type: object
      additionalProperties: false
      required: [title, code, explanation, verified, fix_attempts, output]
      properties:
        title: { type: string }
        code: { type: string }
        explanation: { type: string }
        verified:
          type: [boolean, "null"]
          description: true = it ran, false = still fails after fixes, null = not run (not Python)
        fix_attempts: { type: integer, minimum: 0 }
        output: { type: string, description: What the code printed }

    DraftQuizQuestion:
      type: object
      additionalProperties: false
      required: [question, options, answer_index, explanation]
      properties:
        question: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        answer_index: { type: integer, minimum: 0, maximum: 3 }
        explanation: { type: string }

    LecturerDraft:
      type: object
      additionalProperties: false
      required: [topic, course_name, language, outline, slides, code_examples, quiz]
      properties:
        topic: { type: string }
        course_name: { type: string }
        language: { type: string }
        outline:
          type: array
          items: { type: string }
        slides:
          type: array
          items: { $ref: "#/components/schemas/DraftSlide" }
        code_examples:
          type: array
          items: { $ref: "#/components/schemas/DraftCodeExample" }
        quiz:
          type: array
          items: { $ref: "#/components/schemas/DraftQuizQuestion" }

    LecturerSession:
      type: object
      additionalProperties: false
      required: [session_id, room_id, topic, status, selected_agents, reasoning, memory, draft,
                 revision_count, revisions_left, files]
      properties:
        session_id: { type: string }
        room_id: { type: string }
        topic: { type: string }
        status:
          type: string
          enum: [awaiting_approval, done, incomplete]
        selected_agents:
          type: array
          items: { type: string, enum: [research_agent, slides_agent, code_agent, quiz_agent] }
        reasoning: { type: string, description: Why the orchestrator chose these agents }
        memory:
          type: array
          description: What the assistant remembered about the teacher for this session
          items: { type: string }
        draft:
          description: Empty object only if the session stopped before a draft existed (status incomplete)
          anyOf:
            - { $ref: "#/components/schemas/LecturerDraft" }
            - { type: object, maxProperties: 0 }
        revision_count: { type: integer, minimum: 0 }
        revisions_left: { type: integer, minimum: 0 }
        files:
          type: array
          description: Filled when status is done
          items: { $ref: "#/components/schemas/SessionFile" }

    Asset:
      type: object
      additionalProperties: false
      required: [asset_id, kind, title, origin, status, error, source_url, start_sec, end_sec, provider, model, settings,
                 room_id, session_id, slide_index, parent_asset_id, version, file_url, created_at, updated_at]
      properties:
        asset_id: { type: string }
        kind: { type: string, enum: [pptx, code, quiz, image, source_video, generated_video, audio] }
        title: { type: string }
        origin: { type: string, enum: [upload, external, edited, ai_generated], description: "Where it came from: provenance" }
        status: { type: string, enum: [pending, ready, failed] }
        error: { type: string, description: "Provider message when status is failed" }
        source_url: { type: string, description: "External material (e.g. YouTube); empty otherwise" }
        start_sec: { type: [number, "null"] }
        end_sec: { type: [number, "null"] }
        provider: { type: string, description: "AI provider for generated assets, e.g. qwencloud" }
        model: { type: string }
        settings: { type: object, description: "Generation settings (prompt, duration, audio ...)" }
        room_id: { type: string }
        session_id: { type: string }
        slide_index: { type: [integer, "null"] }
        parent_asset_id: { type: string, description: "Set on edited versions; the original is kept" }
        version: { type: integer, minimum: 1 }
        file_url: { type: [string, "null"], description: "Download route; null when there is no stored file" }
        created_at: { type: string }
        updated_at: { type: string }

    AssetList:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    AssetCreate:
      type: object
      additionalProperties: false
      required: [title, source_url]
      properties:
        kind: { type: string, enum: [source_video], default: source_video }
        title: { type: string, minLength: 1, maxLength: 200 }
        source_url: { type: string, pattern: "^https?://" }
        start_sec: { type: [number, "null"], minimum: 0 }
        end_sec: { type: [number, "null"], minimum: 0 }
        room_id: { type: string }
        session_id: { type: string }
        slide_index: { type: [integer, "null"], minimum: 0 }
