  /teacher/decks/{deck_id}/slides/{index}/image:
    post:
      tags: [M5 teacher]
      operationId: setSlideImage
      summary: "Attach a library image to a slide (empty asset_id removes it)."
      security: [{ bearerAuth: [] }]
