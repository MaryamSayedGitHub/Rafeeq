        "422": { description: Invalid input }

  /teacher/decks/{deck_id}/slides/{index}/visual:
    post:
      tags: [M5 teacher]
      operationId: makeSlideVisual
      summary: "The LLM writes an image prompt for the slide (or use yours), then the diffusion model draws it. Async: poll /teacher/visuals/{task_id}. Repeating the same request does not start a second job."
      security: [{ bearerAuth: [] }]
