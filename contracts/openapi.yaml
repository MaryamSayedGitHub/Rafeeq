        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisualStatus" }
        "404": { description: Not found (or not yours) }

  /teacher/media/capabilities:
    get:
      tags: [M5 teacher]
      operationId: getMediaCapabilities
      summary: "What this server can do: image editing, ffmpeg video/audio editing, speech voices."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaCapabilities" }
        "401": { description: Not signed in as a teacher }

  /teacher/media/upload:
    post:
      tags: [M5 teacher]
      operationId: uploadMedia
      summary: "Add an image, video or audio file to the library (the original is never changed). Same file twice = same asset."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
