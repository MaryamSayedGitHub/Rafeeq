      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonAsset" }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { description: Not found (or not yours) }
        "422": { description: Invalid input }

  /teacher/courses/{course_id}/publish:
    post:
      tags: [M5 teacher]
      operationId: publishCourse
      summary: "Show a snapshot of the course to the students of one of the teacher's rooms. Publish again after editing."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: course_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRequest" }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { description: Not found (or not yours) }
        "422": { description: Invalid input }
