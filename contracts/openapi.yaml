# Rafeeq API contract: DRAFT v0 for the contracts meeting.
# Every field here is a proposal until the team agrees it. After the meeting,
# M1 commits the agreed version and tags it day1-contracts.
#
# How to read this file:
#   paths       = the routes (addresses) of the app, grouped by owner (tags)
#   components  = the JSON shapes ("schemas"). Each one matches a file in contracts/samples/
#   Every schema has additionalProperties: false, so a typo such as "pages" instead
#   of "page" makes the contract test fail instead of passing silently.
openapi: 3.1.0
info:
  title: Rafeeq API
  version: 0.1.0-draft
  description: Contract between the five parts of Rafeeq. Draft v0.
servers:
  - url: http://127.0.0.1:8000
security:
  - bearerAuth: []

tags:
  - name: M1 platform
  - name: M2 knowledge
  - name: M3 tutor
  - name: M4 quiz and profile
  - name: M5 teacher

paths:
  # ---------------------------------------------------------------- M1
  /auth/login:
    post:
      tags: [M1 platform]
      operationId: login
      summary: Log in. Returns a token that every other call sends in the Authorization header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sample file samples/login.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Login" }
        "401": { description: Wrong email or password }

  /rooms:
    get:
      tags: [M1 platform]
      operationId: listMyRooms
      summary: The rooms of the logged-in user (course rooms and, if proposal 1 is accepted, My own study).
      responses:
        "200":
          description: Sample file samples/my_rooms.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyRooms" }
    post:
      tags: [M1 platform]
      operationId: createRoom
      summary: A teacher creates a room and gets its join code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomRequest" }
      responses:
        "200":
          description: Sample file samples/create_room.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateRoomResult" }              

  /rooms/{room_id}/files:
    post:
      tags: [M1 platform]
      operationId: uploadFile
      summary: Upload a course file into a room. M1 stores it, then asks M2 to index it.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
    get:
      tags: [M1 platform]
      operationId: listRoomFiles
      summary: The room's files with their indexing status.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_files.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomFiles" }
      responses:
        "202":
          description: Sample file samples/upload_file.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFile" }
  /auth/register:
    post:
      tags: [M1 platform]
      operationId: register
      summary: Create a student or teacher account. Returns the same thing as login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: Sample file samples/register.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Login" }
        "400": { description: Missing name, invalid email, short password, or unknown join code }
        "409": { description: An account with this email already exists }

  /rooms/join:
    post:
      tags: [M1 platform]
      operationId: joinRoom
      summary: A student joins a room with the teacher's code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRoomRequest" }
      responses:
        "200":
          description: Sample file samples/join_room.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }

  /rooms/{room_id}/join-code:
    get:
      tags: [M1 platform]
      operationId: getJoinCode
      summary: The room's current join code. Teacher of the room only.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/join_code.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinCode" }
        "403": { description: Not the teacher of this room }

  /rooms/{room_id}/students:
    get:
      tags: [M1 platform]
      operationId: listRoomStudents
      summary: Students in the room with activity and mastery. Teacher only.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_students.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomStudents" }
  /snap:
    post:
      tags: [M1 platform]
      operationId: snapAndAsk
      summary: Read a photo. OpenCV cleans it, a vision-language model returns the text and what kind of photo it is.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                room_id: { type: string }
      responses:
        "200":
          description: Sample file samples/snap_result.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapResult" }
        "422": { description: The upload is not an image }
        "503": { description: No image reader is configured (neither M3's OCR nor a vision model) }

  /copilot/message:
    post:
      tags: [M1 platform]
      operationId: copilotMessage
      summary: The one entry point for the student. The Copilot picks a route and calls the right part.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopilotRequest" }
      responses:
        "200":
          description: Sample file samples/copilot_reply.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotReply" }

  # ---------------------------------------------------------------- M2
  /search:
    post:
      tags: [M2 knowledge]
      operationId: searchMaterial
      summary: Find the pieces of course material that answer a question.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Sample file samples/search_material.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchMaterial" }

  /rooms/{room_id}/topics:
    get:
      tags: [M2 knowledge]
      operationId: listTopics
      summary: The topics found in the room's material. M4 and M5 use the topic ids.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/room_topics.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomTopics" }

  /sources/page:
    get:
      tags: [M2 knowledge]
      operationId: getSourcePage
      summary: Open the exact page a citation points to.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { name: file_name, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Sample file samples/source_page.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourcePage" }

  # ---------------------------------------------------------------- M3
  /tutor/answer:
    post:
      tags: [M3 tutor]
      operationId: tutorAnswer
      summary: Answer a question using only the room's material. Called by the Copilot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TutorRequest" }
      responses:
        "200":
          description: Sample file samples/tutor_answer.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TutorAnswer" }

  /tutor/check-work:
    post:
      tags: [M3 tutor]
      operationId: checkWork
      summary: Check a photo of the student's own work. Marks the first wrong step and gives a hint, not the solution.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckWorkRequest" }
      responses:
        "200":
          description: Sample file samples/handwriting_check.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandwritingCheck" }

  # ---------------------------------------------------------------- M4
  /quiz:
    post:
      tags: [M4 quiz and profile]
      operationId: makeQuiz
      summary: Make a quiz on one topic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakeQuizRequest" }
      responses:
        "200":
          description: Sample file samples/make_quiz.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quiz" }

  /quiz/{quiz_id}/submit:
    post:
      tags: [M4 quiz and profile]
      operationId: submitQuiz
      summary: Send the student's answers. Returns the score and how mastery changed.
      parameters:
        - { name: quiz_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitQuizRequest" }
      responses:
        "200":
          description: Sample file samples/submit_quiz.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuizResult" }

  /next-step:
    get:
      tags: [M4 quiz and profile]
      operationId: nextStep
      summary: What the student should do next. Feeds the Today card on the home page.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/next_step.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NextStep" }

  /profile/summary:
    get:
      tags: [M4 quiz and profile]
      operationId: profileSummary
      summary: PROPOSAL 2. Read-only summary of the student, so the tutor can adapt. Called by M3.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/student_summary.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }

  /events:
    post:
      tags: [M4 quiz and profile]
      operationId: recordEvent
      summary: PROPOSAL 3. M3 tells M4 that the student asked a question (later also "understood").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionEvent" }
      responses:
        "204":
          description: Recorded. No body. The request body is samples/question_event.json

  # ---------------------------------------------------------------- M5
  # Insights / report / assistant: placeholders until M5 confirms.
  # Profile and sessions: the lecturer assistant (LangGraph), implemented in rafeeq/teacher.
  # Until M1's login exists, teacher_id is sent explicitly; afterwards it comes from the token.
  /teacher/profile:
    get:
      tags: [M5 teacher]
      operationId: getTeacherProfile
      summary: The teacher's profile, defaults for new sessions, and what the assistant remembers.
      parameters:
        - { $ref: "#/components/parameters/TeacherId" }
      responses:
        "200":
          description: Sample file samples/teacher_profile.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }
        "404": { description: This teacher has no profile yet }
    put:
      tags: [M5 teacher]
      operationId: saveTeacherProfile
      summary: Create or update the profile. An empty teacher_id creates a new teacher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherProfileUpdate" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherProfile" }

  /teacher/sessions:
    get:
      tags: [M5 teacher]
      operationId: listTeacherSessions
      summary: Finished (approved) sessions of a teacher, newest first, with their files.
      parameters:
        - { $ref: "#/components/parameters/TeacherId" }
      responses:
        "200":
          description: Sample file samples/teacher_sessions.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSessions" }
    post:
      tags: [M5 teacher]
      operationId: startLecturerSession
      summary: Prepare a teaching session. Runs the agents and returns when the draft waits for review (can take 1-2 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LecturerSessionRequest" }
      responses:
        "200":
          description: Sample file samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "503": { description: No LLM provider is configured on the server }

  /teacher/sessions/{session_id}:
    get:
      tags: [M5 teacher]
      operationId: getLecturerSession
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Same shape as samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "404": { description: Unknown session }

  /teacher/sessions/{session_id}/decision:
    post:
      tags: [M5 teacher]
      operationId: decideLecturerSession
      summary: approve -> the files are created (status done). revise -> a new draft is built from the feedback.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LecturerDecision" }
      responses:
        "200":
          description: Same shape as samples/lecturer_session.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LecturerSession" }
        "404": { description: Unknown session }
        "409": { description: Not waiting for a decision, or the revision limit is reached }

  /teacher/sessions/{session_id}/files/{name}:
    get:
      tags: [M5 teacher]
      operationId: downloadLecturerFile
      summary: Download a generated file (.pptx, code file, quiz.json, quiz.md). Only names listed in the session.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream: {}
        "404": { description: Unknown session or file }

  /teacher/rooms/{room_id}/insights:
    get:
      tags: [M5 teacher]
      operationId: teacherInsights
      summary: What students ask about and which mistakes repeat.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/insights.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insights" }

  /teacher/rooms/{room_id}/report:
    get:
      tags: [M5 teacher]
      operationId: teacherReport
      summary: How the class is doing per topic, and who is at risk.
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
      responses:
        "200":
          description: Sample file samples/class_report.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassReport" }

  /teacher/assistant:
    post:
      tags: [M5 teacher]
      operationId: teacherAssistant
      summary: The teacher asks for something (a reply, a summary). The assistant drafts it and waits for approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherAssistantRequest" }
      responses:
        "200":
          description: Sample file samples/teacher_assistant.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherAssistant" }

  /teacher/videos/search:
    get:
      tags: [M5 teacher]
      operationId: searchTeachingVideos
      summary: YouTube videos for a question, each opening at the second whose transcript answers it.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 300 } }
        - { name: top_k, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        "200":
          description: Sample file samples/video_search.json. Empty results (not an error) when search or embeddings are unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoSearch" }

  /teacher/videos/generate:
    post:
      tags: [M5 teacher]
      operationId: generateVideo
      summary: Start an animated video (paid, async). Without an image, the teacher's presenter image is the first frame if saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prompt]
              properties:
                teacher_id: { type: string }
                prompt: { type: string, minLength: 3, maxLength: 800 }
                duration: { type: integer, minimum: 2, maximum: 6, default: 5 }
                audio: { type: boolean, default: false }
                image: { type: string, format: binary }
      responses:
        "200":
          description: Sample file samples/video_job.json. 503 when DASHSCOPE_API_KEY is not set, 502 when the provider refuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJob" }

  /teacher/videos/generate/{task_id}:
    get:
      tags: [M5 teacher]
      operationId: videoJobStatus
      summary: Poll an animated video job until it is no longer PENDING or RUNNING.
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file samples/video_job_status.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoJobStatus" }

  /teacher/avatar:
    post:
      tags: [M5 teacher]
      operationId: saveTeacherAvatar
      summary: Save the teacher's presenter image (first frame of their animated videos).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [teacher_id, image]
              properties:
                teacher_id: { type: string }
                image: { type: string, format: binary }
      responses:
        "200":
          description: Sample file samples/avatar_saved.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarSaved" }

  /teacher/avatar/{teacher_id}:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAvatar
      summary: The saved presenter image. 404 if the teacher has none.
      parameters:
        - { name: teacher_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image file
          content:
            image/*:
              schema: { type: string, format: binary }

  /teacher/assets:
    get:
      tags: [M5 teacher]
      operationId: listTeacherAssets
      summary: The teacher's library (saved and generated files, videos, video moments). Needs the teacher's Bearer token.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [pptx, code, quiz, image, source_video, generated_video, video, audio, theme] } }
        - { name: room_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, ready, failed] } }
      responses:
        "200":
          description: Sample file samples/assets.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "401": { description: Not signed in as a teacher }
    post:
      tags: [M5 teacher]
      operationId: createTeacherAsset
      summary: Save an external video moment (e.g. a YouTube result) to the library. Repeating the same request returns the same asset.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetCreate" }
      responses:
        "201":
          description: Sample file samples/asset.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "401": { description: Not signed in as a teacher }
        "422": { description: Invalid input }

  /teacher/assets/{asset_id}:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAsset
      summary: One asset of this teacher. Another teacher's asset is 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file samples/asset.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { description: No such asset }

  /teacher/assets/{asset_id}/file:
    get:
      tags: [M5 teacher]
      operationId: getTeacherAssetFile
      summary: The stored file of an asset. 404 for external material or a file that is not ready.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: asset_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: No such asset or no file }

  /teacher/themes:
    get:
      tags: [M5 teacher]
      operationId: listThemes
      summary: "Built-in themes and the teacher's own (extracted) themes."
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeList" }
        "401": { description: Not signed in as a teacher }

  /teacher/themes/extract:
    post:
      tags: [M5 teacher]
      operationId: extractTheme
      summary: "Read the colours and font of an uploaded .pptx/.potx and keep them as a library theme (same file twice = same theme)."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, name: { type: string } } }
      responses:
        "201":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeExtracted" }
        "401": { description: Not signed in as a teacher }
        "422": { description: Invalid input }

  /teacher/decks:
    get:
      tags: [M5 teacher]
      operationId: listDecks
      summary: "The teacher's editable decks (one per approved lesson with slides)."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: room_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeckList" }
        "401": { description: Not signed in as a teacher }
    post:
      tags: [M5 teacher]
      operationId: createDeck
      summary: "Open (or create) the deck of one of the teacher's finished lessons."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckCreate" }
      responses:
        "201":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "401": { description: Not signed in as a teacher }
        "404": { description: Not found (or not yours) }

  /teacher/decks/{deck_id}:
    get:
      tags: [M5 teacher]
      operationId: getDeck
      summary: "One deck. Another teacher's deck is 404."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: deck_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "404": { description: Not found (or not yours) }
    put:
      tags: [M5 teacher]
      operationId: updateDeck
      summary: "Edit title, slides and theme. A slide picture must be one of the teacher's images; the theme must exist."
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: deck_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckUpdate" }
      responses:
        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deck" }
        "404": { description: Not found (or not yours) }
        "422": { description: Invalid input }

  /teacher/decks/{deck_id}/export:
    post:
      tags: [M5 teacher]
      operationId: exportDeck
      summary: "Build the .pptx with the deck's theme and pictures. Saved in the library as the next version; earlier files are kept."
      security: [{ bearerAuth: [] }]
