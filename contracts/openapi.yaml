        "200":
          description: Sample file in samples/
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisualJob" }
        "404": { description: Not found (or not yours) }
        "502": { description: The provider refused the job }
        "503": { description: DASHSCOPE_API_KEY is not set }

  /teacher/visuals/{task_id}:
    get:
      tags: [M5 teacher]
      operationId: getVisualStatus
      summary: "Status of a slide picture job. When it succeeds the picture is saved in the library and attached to the slide."
      security: [{ bearerAuth: [] }]
