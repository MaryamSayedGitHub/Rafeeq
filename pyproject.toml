[project]
name = "rafeeq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    # M5 teacher: the lecturer assistant (LangGraph pipeline, MCP tools, .pptx export)
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.4",
    "mcp>=1.30.0,<2",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    # M1 platform (sessions, uploads, snap vision)
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.4.6",
    # M3 tutor: web search, photo reading, study files (Word / PDF export)
    "requests>=2.34.2",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "pypdf>=5.0.0",
    "fpdf2>=2.8.9",
    "uharfbuzz>=0.56.3",
    # M5 labs: TTS, video discovery, video generation
    "edge-tts>=7.2.8",
    "elevenlabs>=2.71.0",
    "pgvector>=0.5.1",
    "google-genai>=2.29.0",
    "youtube-transcript-api>=1.0.0",
    "youtube-search-python>=1.6.6",
    "sqlalchemy>=2.1.4",
    "pymupdf>=1.28.2",
]

[project.optional-dependencies]
knowledge = [
    "faiss-cpu>=1.15.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "arabic-reshaper>=3.0.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "python-bidi>=0.6.11",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
